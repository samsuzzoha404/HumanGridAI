[dev-dependencies]
# Testing framework
tokio-test = "0.4"

# Mocking
mockall = "0.12"
wiremock = "0.6"

# Assertions
assert_matches = "1.5"
pretty_assertions = "1.4"

# Test fixtures
rstest = "0.18"

# Async testing
tokio = { version = "1.35", features = ["test-util", "macros", "rt-multi-thread"] }

# HTTP testing
axum-test = "14.0"
tower = { version = "0.4", features = ["util"] }
http = "1.0"
http-body-util = "0.1"

# Database testing
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

[[test]]
name = "integration_tests"
path = "tests/mod.rs"

[profile.test]
opt-level = 0
debug = true
