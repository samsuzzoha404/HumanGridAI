[package]
name = "humangrid-service"
version = "0.1.0"
edition = "2021"
authors = ["HumanGridAI Team"]
description = "Off-chain verification and protocol service for HumanGridAI"

[dependencies]
# Web Framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Blockchain
ethers = { version = "2.0", features = ["abigen", "ws"] }
alloy = { version = "0.1", features = ["full"] }

# Database (for caching, not authority)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

# OpenSSL (vendored to avoid system dependency)
openssl = { version = "0.10", features = ["vendored"] }

# Configuration
dotenv = "0.15"
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography (Phase 1 security fixes)
rsa = "0.9"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.21"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
signature = "2.2"

# Rate Limiting
governor = "0.6"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Environment
envy = "0.4"

[dev-dependencies]
mockito = "1.0"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
